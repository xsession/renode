# Core logging and shell/debug visibility
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_PRINTK=y
CONFIG_ASSERT=y
CONFIG_THREAD_NAME=y
CONFIG_INIT_STACKS=y
CONFIG_STACK_SENTINEL=y

# Useful for debugging stack and timing problems
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_RUNTIME_STATS=y

# GPIO / PWM / CAN
CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_CAN=y
CONFIG_CAN_LOOPBACK_MODE=y

# Console and RTT options. UART console is default on many Nucleo boards.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Optional: enable RTT if your setup supports it.
# CONFIG_USE_SEGGER_RTT=y
# CONFIG_RTT_CONSOLE=y

# Main stack size for debug-friendly printf/logging paths
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Keep debug info useful
CONFIG_DEBUG=y
CONFIG_DEBUG_INFO=y
CONFIG_NO_OPTIMIZATIONS=y
